# A log cabin: 7x5, walls of logs laid along each wall with upright corner posts, log gables,
# a stair roof with a slab ridge and eaves front and back, windows with open trapdoor shutters
# outside, a door with a step, a torch, and a bed, chest and crafting table. Lots of logs
# (about 90), few crafts. Defaults to spruce; any wood works.
name: cabin
description: 7x5 log cabin with horizontal log walls, log gables, stair roof, shuttered windows, torch, bed, chest and crafting table
facing: south
site: near
meta: { tags: [house, cabin, wood], style: log cabin, author: mc-buddy }
stairs: roof
roles:
  floor: { default: spruce_planks, accept: "_planks$", wood: true }
  logs: { default: spruce_log, accept: "^(oak|spruce|birch|jungle|acacia|dark_oak|mangrove|cherry|pale_oak)_log$", material: true, wood: true, state: { axis: y } }
  roof: { default: spruce_stairs, accept: "^(oak|spruce|birch|jungle|acacia|dark_oak|mangrove|cherry|pale_oak|bamboo|crimson|warped)_stairs$", wood: true }
  ridge: { default: spruce_slab, accept: "^(oak|spruce|birch|jungle|acacia|dark_oak|mangrove|cherry|pale_oak|bamboo|crimson|warped)_slab$", wood: true, state: { type: bottom } }
  door: { default: spruce_door, accept: "_door$", kind: door, wood: true }
  window: { default: glass_pane, accept: "^(glass|glass_pane)$", optional: true, wood: true, fallback: [spruce_fence] }
  shutter: { default: spruce_trapdoor, accept: "_trapdoor$", kind: attachment, optional: true, wood: true, state: { open: true, half: bottom } }
  light: { default: torch, accept: "^(wall_)?torch$|^lantern$", kind: attachment, optional: true }
  bed: { default: white_bed, accept: "_bed$", kind: furnish, optional: true }
  chest: { default: chest, kind: furnish, optional: true }
  table: { default: crafting_table, kind: furnish, optional: true }
palette:
  "#": floor
  "|": logs
  X: "logs[axis=x]"
  Z: "logs[axis=z]"
  s: ridge
  D: "door[facing=north,hinge=right]"
  W: window
  S: "shutter[facing=south]"
  T: "light[facing=south]"
  B: "bed[facing=north,part=foot]"
  b: "bed[facing=north,part=head]"
  C: "chest[facing=south]"
  K: table
  ".": air
