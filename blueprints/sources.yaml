# Schematics from the internet that `just blueprint-fetch` downloads and converts into
# blueprints (scripts/blueprint-fetch.ts, docs/guide/blueprints.md#fetching-blueprints).
#
#   redistribute: true    the license lets us share the converted file (CC0, CC-BY, MIT, Apache,
#                         LGPL, public domain, or explicit permission): written to
#                         blueprints/library/ and committed, attribution in its meta and in
#                         blueprints/library/LICENSES.md
#   redistribute: false   unknown, non-commercial or no-derivatives licenses: written to
#                         blueprints/downloaded/ (gitignored, add it to settings.build.blueprintDirs
#                         or the profile's `blueprints:` key to use it). Only this entry is committed.
#   manual: true          the site doesn't allow automated downloads (login, captcha, robots.txt or
#                         terms): download it from `page` yourself, put it in blueprints/downloaded/raw/
#                         under `file`, and the next fetch converts it.
#
# Every url is pinned to a commit, so the file can't change under us; sha256 is checked when set.
# Checked on 2026-11-21: licenses from each repo's LICENSE file (or the mod page where noted).
# Fields: name, url, page, author, license, license_url (its text, saved to blueprints/library/licenses/),
# redistribute, manual, file, tags, notes, sha256, terrain (keep ground and plants as they are),
# crop ("x1 y1 z1 x2 y2 z2"), facing, exact (keep exact woods), max_blocks.
