     "SSScccccccccccSSS",
     "SSS===========SSS",
     " c=============c ",
     " c=============c ",
     " c=============c ",
     " c=============c ",
     " c=============c ",
     " c=============c ",
     " c=============c ",
     " c=============c ",
     " c=============c ",
     " c=============c ",
     " c=============c ",
     "SSS===========SSS",
     "SSScccccccccccSSS",
     "SSS           SSS"]
  # y=1: walls, door in the gate, ladder up the north wall
