     "SSS###########SSS",
     "SSS     H     SSS",
     " #             # ",
     " #             # ",
     " #             # ",
     " #             # ",
     " #             # ",
     " #             # ",
     " #             # ",
     " #             # ",
     " #             # ",
     " #             # ",
     " #             # ",
     "SSS           SSS",
     "SSS#####D#####SSS",
     "SSS           SSS"]
  # y=2: walls, door top half, ladder, torches either side of the gate
