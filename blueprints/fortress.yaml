# A small walled fort, 17x17: stone foundation and a cobblestone floor, walls 3 high (plank or
# stone) with battlements, a walkway behind them reached by a ladder, four 3x3 stone corner towers
# two blocks taller with crenels and a torch on top, and a gate with a door and torches either
# side. The inside is left as it is (a house or a farm goes there).
#
# Version 2 of the fortress: same walls and gate as the first one (15x15 ring) one block up, so
# building it with its origin one block lower (y = ground level) upgrades an old fortress in
# place: existing plank walls count as done, and towers, floor and walkway are added.
name: fortress
description: Walled fort 17x17 with stone corner towers, battlements, a walkway with a ladder, a stone floor and a gate with torches
facing: south            # the gate side, as drawn
site: near
meta: { tags: [defence, fort, walls, stone], style: medieval, author: mc-buddy, version: 2 }
roles:
  stone: { default: cobblestone, accept: "^(cobblestone|mossy_cobblestone|cobbled_deepslate|stone|stone_bricks|mossy_stone_bricks|andesite|polished_andesite)$" }
  foundation: { default: cobblestone, accept: "^(cobblestone|mossy_cobblestone|cobbled_deepslate|stone|stone_bricks|mossy_stone_bricks|andesite|polished_andesite)$" }
  floor: { default: cobblestone, accept: "^(cobblestone|mossy_cobblestone|cobbled_deepslate|stone|stone_bricks|mossy_stone_bricks|andesite|polished_andesite|[a-z_]+_planks)$" }
  wall: { default: cobblestone, accept: "^(cobblestone|mossy_cobblestone|cobbled_deepslate|stone|stone_bricks|mossy_stone_bricks|[a-z_]+_planks)$", material: true }
  walk: { default: cobblestone, accept: "^(cobblestone|mossy_cobblestone|cobbled_deepslate|stone|stone_bricks|mossy_stone_bricks|[a-z_]+_planks|[a-z_]+_slab)$" }
  ladder: { default: ladder, kind: attachment }
  door: { default: oak_door, accept: "_door$", kind: door, wood: true }
  light: { default: torch, accept: "^(wall_)?torch$|^lantern$", kind: attachment, optional: true }
palette:
  S: stone
  c: foundation
  "=": floor
  "#": wall
  w: walk
  H: "ladder[facing=south]"               # on the north wall's inner face
  D: "door[facing=north,hinge=left]"
  t: "light[facing=south]"                # wall torches on the outside of the gate
  T: light                                # standing torch on top of each tower
layers:
  # y=0: ground level: stone foundation under the walls and towers, cobblestone floor inside
