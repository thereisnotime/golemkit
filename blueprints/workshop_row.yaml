# A crafting table and two furnaces in a row against a wall, fronts facing the room. Base
# projects put one inside the walls when there is no table or furnace there.
name: workshop_row
description: Crafting table and two furnaces in a row against a wall
facing: south
site: near
meta: { tags: [workshop, utility, interior], author: golemkit }
roles:
  table: { default: crafting_table, kind: furnish }
  furnace: { default: furnace, accept: "^(furnace|smoker|blast_furnace)$", kind: furnish }
palette:
  K: table
  F: "furnace[facing=south]"
layers:
  - ["KFF"]
