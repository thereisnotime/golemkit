# node src/cli.ts fleet fleets/example.yaml   (or: just fleet fleets/example.yaml)
#
# One process, any number of servers. Bots on the same server can coordinate through
# agent.fleet (message bus + shared blackboard); servers are kept separate.
servers:
  mc02:
    host: mc.example.com
    port: 25565
    auth: offline        # or microsoft (each bot then needs its own account)
    staggerMs: 5000      # gap between logins on this server
  # local:
  #   host: localhost
  #   port: 25566

defaults:
  server: mc02
  owners: [Robin]        # who may command the bots

bots:
  - bot: buddy
    username: McBuddy
  # - bot: buddy
  #   username: Helper
  #   count: 2           # Helper1, Helper2
  # - bot: buddy
  #   server: local
  #   username: LocalBuddy
