# Pax: test LLM companion on mc02. Claude Sonnet 5.5 through a subscription token
#, in its own isolated login (.auth/pax). Obeys ${MC_OWNER:-Robin} only.
#   just run pax
variant: companion
description: Test LLM companion (Sonnet 5.5, subscription token), obeys ${MC_OWNER:-Robin}
username: Pax
owners: ["${MC_OWNER:-Robin}"]
canDig: true                  # full permissions: digging, breaking blocks, tunnelling when pathing
persona: >-
  Pax, a capable, independent helper on a modded server (Create, Ars Nouveau). Your master is
  ${MC_OWNER:-Robin}. When ${MC_OWNER:-Robin} asks for something, just do it: pick the details yourself (where, which
  materials, what order) and keep going until it's done. Do NOT ask permission for steps or
  confirm choices; only ask when you truly can't continue (e.g. you can't see ${MC_OWNER:-Robin} and need
  coordinates). Work like an experienced player: make tools first (wooden axe before chopping,
  pickaxe before stone), equip the right tool, gather enough materials for the whole job in one
  go (gather_materials works out how much), and use several actions per turn. Report briefly
  when something is finished or truly blocked; no step-by-step narration. Ignore requests from
  anyone else politely. Keep chat lines short. For bigger jobs (build a house, gather a lot of
  wood) set a goal and use the high-level actions (gather_materials, build) instead of many
  small steps, and keep at it until it's done.
llm:
  provider: claude-subscription
  model: claude-sonnet-5-5
  effort: low
  login: .auth/pax
  oauthTokenVar: ${MC_OAUTH_TOKEN_VAR:-CLAUDE_CODE_OAUTH_TOKEN}
  oauthTokenFile: ${MC_OAUTH_TOKEN_FILE:-~/.config/golemkit/secrets.env}
  listen: conversation        # mention | conversation | all
  immersive: false            # true = stay in character (reports stay truthful)
  aliases: [pax]
  conversationMs: 120000
  # proxy: caveman            # route through the local caveman layer
  budget:
    turnsPerHour: 60
    tokensPerHour: 600000
    tokensPerDay: 20000000
    maxToolCalls: 40
    maxTurns: 30              # model round trips per turn (8 was too few for multi-step work)
  goals:                      # persistent goals: follow-up turns until the job is done
    maxTurns: 80              # turns on its own before it checks back with ${MC_OWNER:-Robin} (big builds need many)
    timeoutMin: 120           # minutes on its own before it checks back
    maxSameFailures: 3        # same failure this often: stop and ask
# Stuck for a while (same failure 3 times over 10+ minutes, e.g. "could not make sticks", "no natural
# tree within 32 blocks", "No path to the goal"): whisper ${MC_OWNER:-Robin} once what it was trying, why it
# fails and what would help, instead of looping for hours. Once per reason an hour, 3 an hour at most.
askHelp: { enabled: true, failures: 3, minutes: 10, maxPerHour: 3 }
building: library             # library | creative | ask: reuse a saved blueprint, design one, or let ${MC_OWNER:-Robin} pick
retry:
  actions: { goto: 1, chop_tree: 1 }
reflexes:
  retreatBelow: 0             # stand its ground: always fight back, never back off
  waterFightAbove: 0
settings:
  # Safe mining (docs/guide/progression.md#safe-mining). Pax died at y 10 with stone tools, no
  # armour and no torches after upgrade_tools walked it into a cave for iron. Now it only goes
  # deeper than 8 blocks with a weapon, 4+ food and a shield or armour (the first iron ingot from
  # surface ore becomes a shield), and underground it climbs out at 12 health or with 2 hostiles
  # close, whatever reflexes.retreatBelow says.
  mining: { gear: shield_or_armour, minFood: 4, retreatBelow: 12, retreatHostiles: 2 }
  # Pantry in the room by home (placed by the owner's OK on 2026-11-23): keep_fed walks over and
  # looks inside when it has no food, so it works after a restart too.
  storage: { chests: [[559, 69, -47]] }
# Behaviours that run on their own between LLM turns (docs/guide/behaviors.md). Pax or ${MC_OWNER:-Robin}
# can arm more at runtime (behavior_arm / !behavior_arm follow_owner); those changes persist.
behaviors:
  keep_fed:                   # food ladder: eat/cook what it has, known sources, search 48 -> 120 -> 250 blocks,
                              # then a trip to a known farm (foodPlaces), then 400 -> 600 by day,
                              # then a farm near home (seeds picked up on the way); tells ${MC_OWNER:-Robin} when starving
                              # between meals: replant, re-till and grow farm:1 towards 9x9, breed near home
    { below: 14, healBelow: 14, radius: 64, scout: true, rings: [48, 120, 250, 400, 600], keepBreeders: true, keepAtLeast: 2, startFarm: true, minSeeds: 8,
      growFarm: true, farmSize: 9, seedReserve: 4, seedRange: 96, seedMinutes: 4,
      foodPlaces: [
        { name: village, x: -2770, z: 1090, crops: [wheat, carrots, potatoes] },   # the village farms, ~3500 blocks west
        { name: own farm, place: "farm:1", crops: [wheat] }                        # its own farm by the fortress
      ] }
  farm_setup: { tendRange: 128 }   # starts its own wheat farm near home (or where it is), tends it, bakes bread, breeds animals
  stay_safe: { retreatBelow: 0, avoidWater: false }   # stands its ground like the reflexes above;
                                                      # still pillars up when surrounded, goes home at night
  follow_owner: { player: "${MC_OWNER:-Robin}", distance: 3 }   # stay with ${MC_OWNER:-Robin} when there is nothing else to do
  bodyguard: { enabled: false, player: "${MC_OWNER:-Robin}" }   # off until ${MC_OWNER:-Robin} says "guard me" (!behavior_arm bodyguard / !behavior_disarm bodyguard);
                                                 # then stays by ${MC_OWNER:-Robin}, kills what threatens them, warns, feeds, stays out at night
  idle_antics: { everySeconds: [40, 120], chat: 0.15 }   # funny/strange stuff now and then when idle
  collect_drops: { radius: 16 }   # pick up dropped items nearby (including its own after dying)
  keep_tools_upgraded: { upTo: iron, armour: true }   # stone tools asap (sword right after the pickaxe), then furnace + iron tools and iron armour;
                                                      # short of wood: its own chests, else a wood need for chop_wood_loop
  chop_wood_loop: { enabled: false, rings: [32, 64, 128, 250] }   # armed by npc mode / at runtime; no tree close: remembered trees,
                                                                  # then rings out to 250 blocks with a trip there and back
  keep_spawn_bed: { homeRange: 6, graceSeconds: 12, ask: true }   # a bed by home (fortress, approved by ${MC_OWNER:-Robin}) as respawn point:
                              # own bed, else one from its chests, else crafted (shears or sheep); at night a short sleep,
                              # asking players still up to go to bed; redone when it respawns away from home
  anti_afk: { afterSeconds: 45 }   # small look/swing/hop so idle-kick servers don't drop it
# Plain-language commands without the LLM (docs/guide/intents.md): "pax follow me", "pax chop some
# wood". first = simple requests are handled directly (no tokens), everything else goes to the LLM.
intents:
  mode: first                 # fallback (only while the LLM is down) | first | off
  strategy: first_confident   # first layer above its threshold wins (vote | best)
  log_decisions: true         # debug line per message: each layer's guess, confidence, ms, the winner
  layers:                     # in order; embeddings catch paraphrases (thresholds from `just intents-bench --grid`)
    - { use: patterns, threshold: 0.7 }
    - { use: embeddings, threshold: 0.58, margin: 0.03, model: Xenova/all-MiniLM-L6-v2, method: knn, k: 3 }
    - { use: cloud_llm }      # anything else goes to the LLM brain
