# Pax: test LLM companion on mc02. Claude Sonnet 5.5 through a subscription token
#, in its own isolated login (.auth/pax). Obeys robin only.
#   just run pax
variant: companion
description: Test LLM companion (Sonnet 5.5, subscription token), obeys robin
username: Pax
owners: [robin]
canDig: true                  # full permissions: digging, breaking blocks, tunnelling when pathing
persona: >-
  Pax, a capable, independent helper on a modded server (Create, Ars Nouveau). Your master is
  robin. When robin asks for something, just do it: pick the details yourself (where, which
  materials, what order) and keep going until it's done. Do NOT ask permission for steps or
  confirm choices; only ask when you truly can't continue (e.g. you can't see robin and need
  coordinates). Work like an experienced player: make tools first (wooden axe before chopping,
  pickaxe before stone), equip the right tool, gather enough materials for the whole job in one
  go (gather_materials works out how much), and use several actions per turn. Report briefly
  when something is finished or truly blocked; no step-by-step narration. Ignore requests from
  anyone else politely. Keep chat lines short. For bigger jobs (build a house, gather a lot of
  wood) set a goal and use the high-level actions (gather_materials, build) instead of many
  small steps, and keep at it until it's done.
llm:
  provider: claude-subscription
  model: claude-sonnet-5-5
  effort: low
  login: .auth/pax
  oauthTokenVar: CLAUDE_CODE_OAUTH_TOKEN
  oauthTokenFile: ~/.config/mc-buddy/secrets.env
  listen: conversation        # mention | conversation | all
  immersive: false            # true = stay in character (reports stay truthful)
  aliases: [pax]
  conversationMs: 120000
  # proxy: caveman            # route through the local caveman layer
  budget:
    turnsPerHour: 60
    tokensPerHour: 600000
    tokensPerDay: 8000000
    maxToolCalls: 40
    maxTurns: 30              # model round trips per turn (8 was too few for multi-step work)
  goals:                      # persistent goals: follow-up turns until the job is done
    maxTurns: 80              # turns on its own before it checks back with robin (big builds need many)
    timeoutMin: 120           # minutes on its own before it checks back
    maxSameFailures: 3        # same failure this often: stop and ask
building: library             # library | creative | ask: reuse a saved blueprint, design one, or let robin pick
retry:
  actions: { goto: 1, chop_tree: 1 }
reflexes:
  retreatBelow: 0             # stand its ground: always fight back, never back off
  waterFightAbove: 0
# Behaviours that run on their own between LLM turns (docs/guide/behaviors.md). Pax or robin
# can arm more at runtime (behavior_arm / !behavior_arm follow_owner); those changes persist.
behaviors:
  keep_fed:                   # find, cook and eat food when hungry or hurt; scouts up to 200 blocks
    { below: 14, healBelow: 14, radius: 64, scout: true, scoutRadius: 200, keepAtLeast: 2 }   # when nothing is near, starts a farm last
  farm_setup: { tendRange: 128 }   # starts its own wheat farm near home (or where it is), tends it, bakes bread, breeds animals
  stay_safe: { retreatBelow: 0, avoidWater: false }   # stands its ground like the reflexes above;
                                                      # still pillars up when surrounded, goes home at night
  follow_owner: { player: robin, distance: 3 }   # stay with robin when there is nothing else to do
  idle_antics: { everySeconds: [40, 120], chat: 0.15 }   # funny/strange stuff now and then when idle
  collect_drops: { radius: 16 }   # pick up dropped items nearby (including its own after dying)
  keep_tools_upgraded: { upTo: iron }   # stone tools asap, then furnace + iron; re-craft worn tools when idle
  anti_afk: { afterSeconds: 45 }   # small look/swing/hop so idle-kick servers don't drop it
