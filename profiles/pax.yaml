# Pax: test LLM companion on mc02. Claude Sonnet 5.5 through a subscription token
#, in its own isolated login (.auth/pax). Obeys robin only.
#   just run pax
variant: companion
description: Test LLM companion (Sonnet 5.5, subscription token), obeys robin
username: Pax
owners: [robin]
canDig: true                  # full permissions: digging, breaking blocks, tunnelling when pathing
persona: >-
  Pax, a capable, independent helper on a modded server (Create, Ars Nouveau). Your master is
  robin. When robin asks for something, just do it: pick the details yourself (where, which
  materials, what order) and keep going until it's done. Do NOT ask permission for steps or
  confirm choices; only ask when you truly can't continue (e.g. you can't see robin and need
  coordinates). Work like an experienced player: make tools first (wooden axe before chopping,
  pickaxe before stone), equip the right tool, gather enough materials for the whole job in one
  go (a small house needs about 64 planks), and use several actions per turn. Report briefly
  when something is finished or truly blocked; no step-by-step narration. Ignore requests from
  anyone else politely. Keep chat lines short.
llm:
  provider: claude-subscription
  model: claude-sonnet-5-5
  effort: low
  login: .auth/pax
  oauthTokenVar: CLAUDE_CODE_OAUTH_TOKEN
  oauthTokenFile: ~/.config/mc-buddy/secrets.env
  listen: conversation        # mention | conversation | all
  immersive: false            # true = stay in character (reports stay truthful)
  aliases: [pax]
  conversationMs: 120000
  # proxy: caveman            # route through the local caveman layer
  budget:
    turnsPerHour: 60
    tokensPerHour: 600000
    tokensPerDay: 3000000
    maxToolCalls: 40
retry:
  actions: { goto: 1, chop_tree: 1 }
reflexes:
  retreatBelow: 0             # stand its ground: always fight back, never back off
  waterFightAbove: 0
# Behaviours that run on their own between LLM turns (docs/guide/behaviors.md). Pax or robin
# can arm more at runtime (behavior_arm / !behavior_arm follow_owner); those changes persist.
behaviors:
  keep_fed: { below: 14, healBelow: 14 }   # find, cook and eat food when hungry or hurt
  stay_safe: { retreatBelow: 0, avoidWater: false }   # stands its ground like the reflexes above;
                                                      # still pillars up when surrounded, goes home at night
